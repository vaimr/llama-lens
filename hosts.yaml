# llama灵境 主机配置模板
# 用法：cp config/hosts.example.yaml config/hosts.yaml 后填写。
# config/hosts.yaml 与 .env 均含敏感信息，已被 .gitignore 排除，勿提交。

global:
  push_interval: 1.0          # WS 推送间隔（秒）
  history:
    llama_points: 3600        # llama 序列环形缓冲点数（@1s，3600 = 1h）
    host_points: 1800         # host 序列环形缓冲点数（@2s，1800 = 1h）
  # thresholds:               # 全局阈值覆盖（可选，默认见 backend/config.py）
  #   gpu_util: {warn: 80, danger: 90}
  #   ctx: {warn: 80, danger: 90}

hosts:
  - id: faex-qwen3.8
    name: faex/qwen3.8-mtp-q8_k_p-27b
    llama:
      host: faex
      port: 8502
      interval: 1.0
      slow_interval: 30.0
      timeout: 3.0
    ssh:
      host: faex
      port: 5522
      user: llamalens-monitor
      # password: ${AI_SSH_PASS}    # 引用 .env 中的环境变量
      key_path: /app/.ssh/llamalens_key
      interval: 2.0
      keepalive: 15
      timeout: 15.0
    process:
      name: llama-server
    systemd_unit: llama-server.service
    log:
      source: file
      unit: llama-server
      path: /var/logs/llamactl/qwen3.8-mtp-q8_k_p-27b.log
      follow: true
      catchup_sec: 30
    disk_mounts:
      - /
      - /share
    # thresholds:             # 每主机阈值覆盖（可选）
    #   mtp: {warn: 80, danger: 65}

  - id: faex-qwen3.8-flash
